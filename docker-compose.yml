services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql
      - DB_USER=schooluser
      - DB_PASSWORD=schoolpassword
      - DB_NAME=schoolbridge
      - JWT_SECRET=dev_secret_key
      - NODE_ENV=development
    depends_on:
      - mysql
    volumes:
      - ./backend/uploads:/app/uploads

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: schoolbridge
      MYSQL_USER: schooluser
      MYSQL_PASSWORD: schoolpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  mysql_data:
